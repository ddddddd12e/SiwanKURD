{% extends "base.html" %}
{% block title %}ورود | {{ brand }}{% endblock %}
{% block body_class %}center{% endblock %}
{% block content %}
<main class="login">
  <img class="logo big" src="{{ url_for('static', filename='logo.webp') }}" alt="" width="96" height="96">
  <h1 class="wordmark">{{ brand }}</h1>
  <p class="muted">ورود به پنل مدیریت</p>
  <form method="post" class="stack">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label>نام کاربری<input name="username" autocomplete="username" required autofocus></label>
    <label>رمز عبور<input name="password" type="password" autocomplete="current-password" required></label>
    <button class="btn" type="submit">ورود</button>
  </form>
</main>
{% endblock %}
